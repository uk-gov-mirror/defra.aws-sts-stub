name: publish

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.DOCKERHUB_ORG }}/aws-sts-stub
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # Stamp the git version into package.json
      - name: Set package.json version from the tag
        run: npm version "${VERSION#v}" --no-git-tag-version

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Docker Hub OIDC: the action exchanges the GitHub id-token for a Docker
      # Hub session, so no password or access token is stored as a secret.
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_ORG }}
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTION_ID }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # skip any releases containing a dash, e.g. v123-test, from having a latest tag
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
